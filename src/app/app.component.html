<!-- Extract to "src/app/app.html" -->
    <main class="py-4 container">
      <header class="p-4 mb-4 bg-light rounded-3">
        <h1>{{appTitle}}</h1>
        <p>Votre panier s'élève à {{count() | currency}}</p>
        <p class="mb-0"><a class="btn btn-primary btn-large">Voir mon panier</a></p>
      </header>

      <h2 class="h4">Catalogue</h2>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        @if(hasProductsInStock()){
          @for (product of products(); track product.id) {
            @if(product.stock > 0){
              <app-product-card
              [attr.data-testid]="`productCard-${product.id}`"
              [product]="product" 
              (addToBasket)="updateBasket($event)"/>
            }
          }
        } @else {
          <p data-testid="emptyMessage">Désolé, notre stock est vide !</p>
        }
      </div>
</main>
